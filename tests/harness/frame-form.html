<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Harness — formulário de iframe</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 8px;
      }
      label {
        display: block;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <form class="alvo" onsubmit="return false;">
      <label for="nome">Nome do iframe</label>
      <input id="nome" name="nome" type="text" />
    </form>
  </body>
</html>
