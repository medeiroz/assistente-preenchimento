<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Harness NFS-e (Vue 2 + vue-multiselect)</title>
    <link rel="stylesheet" href="/vendor/vue-multiselect.min.css" />
    <style>
      body {
        font-family: sans-serif;
      }
      .modal {
        display: none;
      }
      .modal.is-active {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        overflow: auto;
      }
      .eui-modal {
        background: #fff;
        margin: 20px auto;
        width: 720px;
        max-width: 95%;
        padding: 16px;
      }
      .eui-confirm-wrapper {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
      }
      .eui-confirm {
        background: #fff;
        margin: 120px auto;
        width: 360px;
        padding: 16px;
      }
      .eui-field {
        margin-bottom: 12px;
      }
      .eui-label {
        display: block;
        font-weight: bold;
      }
      .eui-input-text {
        width: 100%;
        box-sizing: border-box;
      }
      .multiselect__clear {
        position: absolute;
        right: 40px;
        top: 8px;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        cursor: pointer;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <button id="open-nfse" type="button" @click="open()">Abrir NFS-e</button>
      <div v-if="mounted" class="modal eui-modal-wrapper is-large" :class="{ 'is-active': active }">
        <div class="eui-modal modal-card">
          <header>
            <div class="eui-modal-header modal-card-head">
              <div class="eui-modal-title modal-card-title">
                <span>Emitir Nota Fiscal de Serviços Eletrônica</span>
              </div>
            </div>
            <button class="eui-modal-close" type="button" aria-label="Fechar" @click="close()">
              x
            </button>
          </header>
          <div class="eui-modal-body modal-card-body">
            <div
              class="eui-field is-medium is-basic is-fullwidth has-label-at-top eui-input-text-field"
            >
              <label :for="ids.descricao" class="eui-label">Descrição</label>
              <div class="eui-control">
                <input
                  :id="ids.descricao"
                  v-model="descricao"
                  type="text"
                  placeholder="Digite"
                  autocomplete="off"
                  data-cy="default-input-text"
                  class="eui-input eui-input-text"
                />
              </div>
            </div>
            <div
              class="eui-field is-medium is-basic is-fullwidth has-label-at-top eui-input-text-field"
            >
              <label :for="ids.nbs" class="eui-label">Código NBS</label>
              <div class="eui-control">
                <input
                  :id="ids.nbs"
                  v-model="nbs"
                  type="text"
                  placeholder="Digite"
                  autocomplete="off"
                  data-cy="default-input-text"
                  class="eui-input eui-input-text"
                />
              </div>
            </div>
            <div
              class="eui-field is-medium is-basic is-fullwidth has-label-at-top eui-input-select-field"
            >
              <label :for="ids.consumo" class="eui-label">Operação de uso ou consumo pessoal</label>
              <div class="eui-control">
                <multiselect
                  v-model="consumo"
                  class="eui-input eui-input-select is-clearable is-color-basic"
                  placeholder="Selecione"
                  :searchable="false"
                  label="name"
                  track-by="id"
                  :options="optsConsumo"
                >
                  <template v-slot:clear>
                    <div
                      v-if="consumo"
                      class="multiselect__clear"
                      @mousedown.prevent.stop="consumo = null"
                    >
                      ×
                    </div>
                  </template>
                </multiselect>
              </div>
            </div>
            <div
              class="eui-field is-medium is-basic is-fullwidth has-label-at-top eui-input-select-field"
            >
              <label :for="ids.governamental" class="eui-label"
                >Tipo de operação governamental</label
              >
              <div class="eui-control">
                <multiselect
                  v-model="governamental"
                  class="eui-input eui-input-select is-clearable is-color-basic"
                  placeholder="Selecione"
                  :searchable="false"
                  label="name"
                  track-by="id"
                  :options="optsGov"
                ></multiselect>
              </div>
            </div>
            <div
              class="eui-field is-medium is-basic is-fullwidth has-label-at-top eui-input-select-field"
            >
              <label :for="ids.nome" class="eui-label">Nome</label>
              <div class="eui-control">
                <multiselect
                  v-model="nome"
                  class="eui-input eui-input-select is-clearable is-color-basic"
                  placeholder="Selecione"
                  :searchable="true"
                  label="name"
                  track-by="id"
                  :options="optsNome"
                ></multiselect>
              </div>
            </div>
            <div id="outros-campos" class="eui-section">
              <h3>Outros campos</h3>
              <div class="eui-field is-medium is-basic is-fullwidth eui-input-select-field">
                <label :for="ids.distribuidora" class="eui-label">Distribuidora</label>
                <div class="eui-control">
                  <select :id="ids.distribuidora" v-model="distribuidora" class="eui-input">
                    <option value="">Selecione</option>
                    <option value="Energia Exemplo">Energia Exemplo</option>
                    <option value="Luz Teste">Luz Teste</option>
                  </select>
                </div>
              </div>
              <div class="eui-field is-medium is-basic is-fullwidth eui-input-radio-field">
                <label class="eui-label">Tipo de conta</label>
                <div class="eui-control">
                  <input
                    :id="ids.tipoConta + '-res'"
                    v-model="tipoConta"
                    type="radio"
                    name="tipo-conta"
                    value="residencial"
                  />
                  <label :for="ids.tipoConta + '-res'">Residencial</label>
                  <input
                    :id="ids.tipoConta + '-com'"
                    v-model="tipoConta"
                    type="radio"
                    name="tipo-conta"
                    value="comercial"
                  />
                  <label :for="ids.tipoConta + '-com'">Comercial</label>
                </div>
              </div>
              <div
                class="eui-field is-medium is-basic is-fullwidth has-label-at-right eui-input-switch-field"
              >
                <label :for="ids.debitoAuto" class="eui-label">Débito automático</label>
                <div class="eui-control">
                  <input
                    :id="ids.debitoAuto"
                    v-model="debitoAuto"
                    type="checkbox"
                    class="eui-input eui-input-switch"
                  />
                </div>
              </div>
              <div
                class="eui-field is-medium is-primary is-fullwidth has-label-at-top eui-input-toggle-field"
              >
                <label :for="ids.tipoPessoa" class="eui-label">Tipo de pessoa</label>
                <div class="eui-control">
                  <div
                    :id="ids.tipoPessoa"
                    class="eui-button-group is-medium is-primary is-grouped is-fullwidth"
                  >
                    <div class="eui-button-group-wrapper">
                      <button
                        type="button"
                        class="eui-button is-medium is-primary"
                        :class="tipoPessoa === 'Física' ? 'is-filled' : 'is-outlined'"
                        @click="tipoPessoa = 'Física'"
                      >
                        Física
                      </button>
                      <button
                        type="button"
                        class="eui-button is-medium is-primary"
                        :class="tipoPessoa === 'Jurídica' ? 'is-filled' : 'is-outlined'"
                        @click="tipoPessoa = 'Jurídica'"
                      >
                        Jurídica
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="eui-field is-medium is-basic is-fullwidth eui-input-date-field">
                <label :for="ids.vencimento" class="eui-label">Vencimento</label>
                <div class="eui-control">
                  <input :id="ids.vencimento" v-model="vencimento" type="date" class="eui-input" />
                </div>
              </div>
              <div class="eui-field is-medium is-basic is-fullwidth eui-input-date-field">
                <label :for="ids.competencia" class="eui-label">Data de competência</label>
                <div class="eui-control">
                  <input
                    :id="ids.competencia"
                    v-model="competencia"
                    type="text"
                    placeholder="Digite"
                    autocomplete="off"
                    data-cy="default-input-date"
                    class="eui-input eui-input-datepicker"
                  />
                </div>
              </div>
            </div>
            <div v-if="late" id="mais-campos" class="eui-section">
              <h3>Mais campos</h3>
              <div
                class="eui-field is-medium is-basic is-fullwidth has-label-at-top eui-input-text-field"
              >
                <label :for="ids.interno" class="eui-label">Código interno do contribuinte</label>
                <div class="eui-control">
                  <input
                    :id="ids.interno"
                    v-model="interno"
                    type="text"
                    placeholder="Digite"
                    autocomplete="off"
                    data-cy="default-input-text"
                    class="eui-input eui-input-text"
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="eui-modal-footer">
            <button type="button" id="emit-nfse" @click="emit()">Emitir NFS-e</button>
          </div>
        </div>
      </div>
      <div v-if="confirmOpen" class="eui-confirm-wrapper" role="dialog" aria-modal="true">
        <div class="eui-confirm">
          <p class="eui-confirm-title">Deseja cancelar a emissão da nota?</p>
          <div class="eui-confirm-actions">
            <button type="button" class="eui-confirm-back" @click="confirmBack()">Voltar</button>
            <button type="button" class="eui-confirm-cancel" @click="confirmCancel()">
              Sim, cancelar
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="/vendor/vue.min.js"></script>
    <script src="/vendor/vue-multiselect.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
