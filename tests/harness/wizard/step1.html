<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assistente fictício</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 24px auto;
      }
      div.f {
        margin: 12px 0;
      }
      label {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Passo 1 de 3</h1>
    <form action="step2.html" method="get">
      <div class="f">
        <label for="nome">Nome completo</label
        ><input id="nome" name="nome" type="text" autocomplete="off" />
      </div>
      <div class="f">
        <label for="cidade">Cidade</label
        ><input id="cidade" name="cidade" type="text" autocomplete="off" />
      </div>
      <div class="f">
        <label for="senha">Senha de acesso</label
        ><input id="senha" type="password" autocomplete="new-password" />
      </div>
      <button type="submit" id="proximo">Próximo</button>
    </form>
  </body>
</html>
