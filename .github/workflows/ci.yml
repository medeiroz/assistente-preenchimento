name: CI/CD
# Único ponto de entrada: tudo o que roda neste repositório começa aqui e chama os outros
# arquivos desta pasta (verificar.yml, release.yml, publicar-loja.yml, estado-lojas.yml).
#  - Pull request: só os checks.
#  - Push na main: checks, release automática e envio às três lojas (um nó por loja).
#  - Agendado (a cada 6h) ou manual "pendentes": reenvia a última Release onde faltar
#    (a Chrome Web Store recusa envios enquanto há uma revisão em andamento).
#  - Manual "estado": mostra o que Chrome e Firefox dizem de cada versão.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        default: pendentes
        options: [pendentes, estado]

permissions:
  contents: read

concurrency:
  # Execuções agendadas/manuais não disputam a fila com a release de um push.
  group: ci-${{ github.event_name == 'schedule' && 'agenda' || github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  # Em PRs cancela execuções antigas; na main nunca, para não interromper uma release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- push e pull request
  verificar:
    name: Verificar
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/verificar.yml

  release:
    name: Release
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  # Um nó por loja: se uma falhar, dá para reexecutar só ela. Uma versão já enviada é pulada
  # (scripts/publicar-loja.mjs), então reexecutar nunca repete envio.
  publicar-chrome:
    name: Publicar no Chrome
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publicar-loja.yml
    with:
      loja: chrome
      versao: ${{ needs.release.outputs.version }}
    secrets: inherit

  publicar-firefox:
    name: Publicar no Firefox
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publicar-loja.yml
    with:
      loja: firefox
      versao: ${{ needs.release.outputs.version }}
    secrets: inherit

  publicar-edge:
    name: Publicar no Edge
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publicar-loja.yml
    with:
      loja: edge
      versao: ${{ needs.release.outputs.version }}
    secrets: inherit

  # ------------------------------------------------------------- agendado e manual
  ultima:
    name: Última Release
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.acao == 'pendentes')
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "versao=${tag#v}" >> "$GITHUB_OUTPUT"

  pendente-chrome:
    name: Pendente no Chrome
    needs: ultima
    permissions:
      contents: write
    uses: ./.github/workflows/publicar-loja.yml
    with:
      loja: chrome
      versao: ${{ needs.ultima.outputs.versao }}
    secrets: inherit

  pendente-firefox:
    name: Pendente no Firefox
    needs: ultima
    permissions:
      contents: write
    uses: ./.github/workflows/publicar-loja.yml
    with:
      loja: firefox
      versao: ${{ needs.ultima.outputs.versao }}
    secrets: inherit

  pendente-edge:
    name: Pendente no Edge
    needs: ultima
    permissions:
      contents: write
    uses: ./.github/workflows/publicar-loja.yml
    with:
      loja: edge
      versao: ${{ needs.ultima.outputs.versao }}
    secrets: inherit

  estado:
    name: Estado nas lojas
    if: github.event_name == 'workflow_dispatch' && inputs.acao == 'estado'
    uses: ./.github/workflows/estado-lojas.yml
    secrets: inherit
