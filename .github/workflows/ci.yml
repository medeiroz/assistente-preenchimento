name: CI
# Pull requests: só os checks. Push na main: checks e, se tudo passar, release automática.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Em PRs cancela execuções antigas; na main nunca, para não interromper uma release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prettier --check .
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O Chromium novo em modo headless carrega extensões; o xvfb é uma garantia
      # caso algum teste abra uma janela com display.
      - run: xvfb-run -a npm run e2e
      - name: Enviar relatórios de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release automática
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Nunca duas releases ao mesmo tempo (nem cancela a que está rodando).
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: git fetch --tags --force

      - name: Definir a versão
        id: version
        run: |
          version="$(node scripts/next-version.mjs)"
          echo "Versão da release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm ci
          # Atualiza package.json e package-lock.json; o manifest herda do package.json.
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Gerar o pacote
        run: npm run zip

      - name: Verificar conteúdo do pacote
        run: |
          zip_file="$(ls .output/*-chrome.zip)"
          echo "Pacote: $zip_file"
          unzip -l "$zip_file"
          rm -rf .output/zip-check
          unzip -q "$zip_file" -d .output/zip-check
          bad=0
          for term in e2e-harness e2eDenyPermissions localhost; do
            if grep -rIl -- "$term" .output/zip-check; then
              echo "::error::O pacote contém \"$term\": parece um build de testes. Abortando."
              bad=1
            fi
          done
          rm -rf .output/zip-check
          exit "$bad"

      - name: Calcular sha256
        run: |
          cd .output
          for f in *-chrome.zip; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256

      - name: Commit do bump, tag e push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "package.json já está na versão $VERSION; nada para commitar."
          else
            git commit -m "chore(release): v$VERSION [skip ci]"
            if ! git push origin HEAD:main; then
              echo "Push recusado; atualizando e tentando mais uma vez."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" .output/*-chrome.zip .output/*-chrome.zip.sha256 \
            --title "v$VERSION" --generate-notes --latest
