name: Publicar em uma loja
# Chamado pelo CI (um nó por loja) e pela retentativa agendada. Cada nó pode ser reexecutado
# sozinho; uma versão já enviada é pulada (store/PUBLICAR.md §9).
on:
  workflow_call:
    inputs:
      loja:
        description: chrome, firefox ou edge
        required: true
        type: string
      versao:
        description: x.y.z (sem o v)
        required: true
        type: string

jobs:
  publicar:
    name: Enviar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Baixar os pacotes da Release
        run: gh release download "v${{ inputs.versao }}" --dir .output/release --pattern '*.zip'
      - name: Publicar
        run: node scripts/publicar-loja.mjs "${{ inputs.loja }}" "${{ inputs.versao }}"
